<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0b1e">
<title>Block Breaker - Free Online Brick Breaker Game with Power-Ups</title>
<meta name="description" content="Play Block Breaker free in your browser. A fast brick breaker game with 8 levels, Endless mode, and power-ups like twin ball, fireball, laser, giant ball and bomb ball. Works on phone, tablet and desktop. No download.">
<meta name="robots" content="index, follow, max-image-preview:large">
<meta name="color-scheme" content="dark">
<link rel="icon" href="icon.svg" type="image/svg+xml">

<!-- Social sharing -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Block Breaker">
<meta property="og:title" content="Block Breaker - Free Online Brick Breaker Game">
<meta property="og:description" content="Smash bricks, catch power-ups and beat every level. Free brick breaker game for phone, tablet and desktop.">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Block Breaker - Free Online Brick Breaker Game">
<meta name="twitter:description" content="Smash bricks, catch power-ups and beat every level. Free, no download.">

<!-- Structured data: tells Google this page is a free web game -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "VideoGame",
  "name": "Block Breaker",
  "description": "A free brick breaker game you play in your browser. Break bricks, catch power-ups and beat levels or survive Endless mode.",
  "genre": ["Arcade", "Brick breaker"],
  "playMode": "SinglePlayer",
  "applicationCategory": "Game",
  "operatingSystem": "Any (web browser, phone, tablet, desktop)",
  "inLanguage": "en",
  "isAccessibleForFree": true,
  "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
}
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<main>
  <div class="wrap" id="wrap">
  <div class="stage" id="stage">
    <canvas id="game" aria-label="Block Breaker game area"></canvas>

    <!-- Pause, sound and full screen buttons (shown only while playing) -->
    <div class="hudbtns hidden" id="hudBtns">
      <button id="fsBtn" type="button" aria-label="Full screen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
      <button id="pauseBtn" type="button" aria-label="Pause">
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      </button>
      <button id="muteBtn" type="button" aria-label="Sound on or off">
        <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M4 9v6h4l5 4V5L8 9H4z" stroke="none"/>
          <path class="wave" d="M16 9c1.5 1.5 1.5 4.5 0 6M18.5 6.5c3 3 3 8 0 11" fill="none"/>
          <path class="cross" d="M16 9l5 6M21 9l-5 6" fill="none"/>
        </svg>
      </button>
    </div>

    <!-- Menu -->
    <section class="screen menu" id="menu">
      <h1 class="title">Block<br>Breaker</h1>
      <p class="tag">Smash every brick. Catch the power-ups.</p>
      <div class="grp">
        <span class="lbl">Mode</span>
        <div class="seg" id="modeSeg">
          <button type="button" data-mode="classic" class="on">Classic</button>
          <button type="button" data-mode="endless">Endless</button>
        </div>
      </div>
      <p class="desc" id="modeDesc"></p>
      <div class="grp">
        <span class="lbl">Difficulty</span>
        <div class="seg" id="diffSeg">
          <button type="button" data-diff="easy">Easy</button>
          <button type="button" data-diff="normal" class="on">Normal</button>
          <button type="button" data-diff="hard">Hard</button>
        </div>
      </div>
      <p class="best" id="menuBest"></p>
      <button id="playBtn" class="btn xl" type="button">Play</button>
    </section>

    <!-- Pause -->
    <section class="screen panel hidden" id="pause">
      <h2>Paused</h2>
      <div class="col">
        <button id="resumeBtn" class="btn" type="button">Resume</button>
        <button id="pMenuBtn" class="btn ghost" type="button">Quit to menu</button>
      </div>
    </section>

    <!-- Level clear -->
    <section class="screen panel hidden" id="clear">
      <h2 id="cTitle">Level clear!</h2>
      <p class="rank" id="cBonus"></p>
      <button id="nextBtn" class="btn" type="button">Next level</button>
    </section>

    <!-- Game over -->
    <section class="screen panel hidden" id="over">
      <h2 id="oTitle">Game over</h2>
      <p class="rank" id="oMsg"></p>
      <ul class="stats">
        <li><span>Score</span><b id="oScore">0</b></li>
        <li><span>Best score</span><b id="oBest">0</b></li>
        <li id="oLevelLi"><span>Level reached</span><b id="oLevel">1</b></li>
        <li id="oTimeLi" class="hidden"><span>Time survived</span><b id="oTime">0:00</b></li>
        <li><span>Bricks broken</span><b id="oBricks">0</b></li>
        <li><span>Best combo</span><b id="oCombo">0</b></li>
      </ul>
      <div class="row">
        <button id="oMenuBtn" class="btn ghost" type="button">Menu</button>
        <button id="againBtn" class="btn" type="button">Play again</button>
      </div>
    </section>
  </div>
  </div>

  <noscript><p class="noscript">Block Breaker needs JavaScript. Please turn it on in your browser to play.</p></noscript>
</main>

<script src="js/game.js"></script>
</body>
</html>
